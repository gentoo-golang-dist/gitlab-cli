workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - deploy
  - release

test-job:
  stage: test
  script: echo test

mr-only-job:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script: echo mr

tag-only-job:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script: echo release

default-branch-job:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script: echo deploy

schedule-job:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script: echo schedule

never-on-mr:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: on_success
  script: echo not-mr
