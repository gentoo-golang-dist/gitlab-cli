stages:
  - build
  - test
  - deploy

compile:
  stage: build
  script: make build

unit-tests:
  stage: test
  script: make test
  needs:
    - compile

integration-tests:
  stage: test
  script: make integration
  needs:
    - job: compile
      artifacts: true

deploy-prod:
  stage: deploy
  script: make deploy
  needs:
    - unit-tests
    - integration-tests
